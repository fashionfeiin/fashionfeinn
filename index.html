<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF | Precision Fit & Curated Fashion</title>
    <!-- 1. Add Supabase JS CDN here -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400">
</head>
<body>

    <!-- 2. ADD HAMBURGER BUTTON & DRAWER HERE -->
    <!-- Left Slide-Out Hamburger Drawer -->
    <div id="navOverlay" class="drawer-overlay"></div>
    <aside id="sideDrawer" class="side-drawer">
        <div class="drawer-header">
            <span style="letter-spacing: 4px; font-weight: 600;">FF MENU</span>
            <button id="closeDrawerBtn" class="close-btn">&times;</button>
        </div>
        <nav class="drawer-links">
            <a href="index.html">Home</a>
            <a href="collection.html">Collection</a>
            <a href="visualizer.html">Try on Visualizer</a>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
            <button type="button" id="openProfileBtn" class="profile-menu-btn">
                👤 My Profile & Saved Sizes
            </button>
        </nav>
    </aside>

    <!-- Navigation Bar -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #fff; border-bottom: 1px solid #e0e0e0;">
        <div style="display: flex; align-items: center; gap: 20px;">
            <!-- Hamburger Button on Left -->
            <button id="hamburgerBtn" class="hamburger-btn" aria-label="Open Navigation Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="logo">
                <h2 style="letter-spacing: 4px; font-weight: 400;">FF</h2>
            </div>
        </div>

        <div class="nav-actions">
            <a href="login.html" style="padding: 10px 20px; background-color: #1a1a1a; color: #fff; text-decoration: none; border-radius: 4px; font-size: 13px; letter-spacing: 1px;">
                Sign In
            </a>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero-section">
        <div class="hero-content">
            <span class="tagline">Tailored to perfection</span>
            <!-- Rest of your hero content... -->
        </div>
    </section>

    <!-- 3. ADD PROFILE MODAL RIGHT BEFORE BODY CLOSES -->
    <div id="profileModal" class="profile-modal">
        <div class="profile-modal-content">
            <button id="closeProfileBtn" class="close-btn" style="float: right;">&times;</button>
            
            <h2 id="profileWelcomeHeader" style="font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 6px;">
                Welcome, Guest
            </h2>
            <p id="profileEmailSubtext" style="font-size: 13px; color: #666; margin-bottom: 24px;">
                Sign in to sync your sizing history across devices.
            </p>

            <div class="saved-data-card">
                <h4 style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 12px;">
                    Your Saved Body Measurements & Sizing
                </h4>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Rec. Size</span>
                        <strong id="savedSizeDisplay" class="stat-value">M</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Height</span>
                        <strong id="savedHeightDisplay" class="stat-value">175 cm</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Weight</span>
                        <strong id="savedWeightDisplay" class="stat-value">70 kg</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Chest/Bust</span>
                        <strong id="savedChestDisplay" class="stat-value">96 cm</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Waist</span>
                        <strong id="savedWaistDisplay" class="stat-value">80 cm</strong>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Hips</span>
                        <strong id="savedHipsDisplay" class="stat-value">98 cm</strong>
                    </div>
                    <div class="stat-box" style="grid-column: span 3;">
                        <span class="stat-label">Inseam</span>
                        <strong id="savedInseamDisplay" class="stat-value">81 cm</strong>
                    </div>
                </div>

                <div id="savedHistoryList" style="margin-top: 16px; font-size: 13px; color: #444;"></div>
            </div>

            <button id="logoutBtn" style="margin-top: 20px; width: 100%; padding: 12px; background: #f4f4f4; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 13px;">
                Sign Out
            </button>
        </div>
    </div>

    <!-- Load external JS script -->
    <script src="script.js"></script>
</body>
</html>
